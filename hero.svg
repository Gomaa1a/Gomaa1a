<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="Ahmed Gomaa - Full-stack engineer, AI products and data systems">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#131a24"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="230" rx="8" fill="url(#bg)"/>
  <rect x="0" y="0" width="3" height="230" fill="#58a6ff" opacity="0.65"/>

  <text x="58" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="600" fill="#e6edf3" letter-spacing="0.5">Ahmed Gomaa</text>

  <rect x="60" y="110" width="0" height="2" fill="url(#rule)">
    <animate attributeName="width" values="0;260" dur="1.6s" fill="freeze"/>
  </rect>

  <text x="60" y="142" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#8b949e" opacity="0">
    Full-stack engineer
    <animate attributeName="opacity" values="0;1" dur="0.9s" begin="1.2s" fill="freeze"/>
  </text>
  <text x="60" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#6e7681" opacity="0">
    AI products, data systems, and the automation between them
    <animate attributeName="opacity" values="0;1" dur="0.9s" begin="1.7s" fill="freeze"/>
  </text>

  <g stroke="#30363d" stroke-width="1.2" fill="none" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1.4s" begin="0.6s" fill="freeze"/>
    <path d="M660 150 L740 70 L820 140 L900 60"/>
    <path d="M770 182 L820 140 L932 158"/>
    <path d="M660 150 L770 182"/>
    <path d="M900 60 L932 158"/>
  </g>

  <g fill="#58a6ff">
    <circle cx="660" cy="150" r="3.5"/>
    <circle cx="740" cy="70" r="3.5"/>
    <circle cx="820" cy="140" r="4.5"/>
    <circle cx="900" cy="60" r="3.5"/>
    <circle cx="932" cy="158" r="3.5"/>
    <circle cx="770" cy="182" r="3.5"/>
  </g>

  <g fill="none" stroke="#58a6ff" stroke-width="1">
    <circle cx="820" cy="140" r="5"><animate attributeName="r" values="5;22" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="70" r="5"><animate attributeName="r" values="5;18" dur="4s" begin="1.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.45;0" dur="4s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="932" cy="158" r="5"><animate attributeName="r" values="5;18" dur="4s" begin="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.45;0" dur="4s" begin="2.6s" repeatCount="indefinite"/></circle>
  </g>

  <circle r="3" fill="#79c0ff">
    <animateMotion dur="9s" repeatCount="indefinite" path="M660 150 L740 70 L820 140 L900 60"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.5" fill="#79c0ff">
    <animateMotion dur="9s" begin="4.5s" repeatCount="indefinite" path="M770 182 L820 140 L932 158"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="9s" begin="4.5s" repeatCount="indefinite"/>
  </circle>
</svg>
